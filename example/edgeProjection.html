<!DOCTYPE html>
<html>
<head>
    <title>three-edge-projection - Projected Edge Generation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style type="text/css">
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
			font-family: monospace;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        #output {
            color: #333;
            position: absolute;
            left: 10px;
            bottom: 10px;
            white-space: pre;
        }

        #info {
            position: absolute;
            top: 0;
            width: 100%;
            color: #333;
            font-family: monospace;
            text-align: center;
            padding: 5px 0;
        }

        #dropZone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
        }

        #dropZone.active {
            opacity: 1;
            pointer-events: all;
        }

        #dropZone::before {
            content: 'Drop GLB file here';
            font-size: 24px;
            color: #333;
            border: 3px dashed #666;
            padding: 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
	<div id="info">
		Accelerated geometry edge projection and clipping onto<br/>the XZ plane for orthographic vector views.<br/>Drag and drop a GLB file to load a new model.
	</div>
	<div id="dropZone"></div>
	<div id="output"></div>
    <script type="module" src="./edgeProjection.js"></script>
</body>
</html>
